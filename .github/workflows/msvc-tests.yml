name: Windows MSVC Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  OTOK_VERSION: 0.5.6
  # otok's cache (downloads, recipe trees, built libraries) where actions/cache keeps it
  OTOK_CACHE_DIR: ${{ github.workspace }}\.otok-cache

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            submodules: false

      - name: Force checkout all submodules (including update=none)
        run: git -c submodule."tpls/dataforge".update=checkout -c submodule."tpls/numetron".update=checkout -c submodule."tpls/sonia-prime".update=checkout submodule update --init --recursive

      - name: Install otok
        shell: pwsh
        run: |
            $name = "otok-$env:OTOK_VERSION-windows-x64"
            $dir = Join-Path $env:RUNNER_TEMP otok
            $url = "https://github.com/otok-dev/otok/releases/download/v$env:OTOK_VERSION/$name.zip"
            Invoke-WebRequest $url -OutFile "$dir.zip"
            # to a file: GitHub serves the .sha256 as application/octet-stream, whose .Content is bytes, not text
            Invoke-WebRequest "$url.sha256" -OutFile "$dir.zip.sha256"
            $expected = ((Get-Content -Raw "$dir.zip.sha256").Trim() -split '\s+')[0].ToLowerInvariant()
            if ((Get-FileHash -Algorithm SHA256 "$dir.zip").Hash.ToLowerInvariant() -ne $expected) { throw "otok: sha256 mismatch" }
            Expand-Archive "$dir.zip" -DestinationPath $dir
            $exe = Get-ChildItem $dir -Recurse -Filter otok.exe | Select-Object -First 1
            $exe.DirectoryName >> $env:GITHUB_PATH

      - name: Get MSVC version
        id: msvc
        shell: pwsh
        run: |
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installPath) {
                throw "Visual Studio with C++ tools not found"
            }

            $msvcDir = Join-Path $installPath "VC\Tools\MSVC"
            $version = (Get-ChildItem $msvcDir | Sort-Object Name -Descending | Select-Object -First 1).Name

            "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache otok
        uses: actions/cache@v4
        with:
            path: ${{ env.OTOK_CACHE_DIR }}
            key: otok-${{ runner.os }}-${{ steps.msvc.outputs.version }}-${{ hashFiles('otok.toml', 'otok.lock') }}
            restore-keys: |
              otok-${{ runner.os }}-${{ steps.msvc.outputs.version }}-
              otok-${{ runner.os }}-

      - name: Install Dependencies
        run: otok install --locked --progress plain

      # the whole logs of failed builds (otok prints only their end)
      - name: Upload logs of failed builds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
            name: otok-failed-builds
            path: ${{ env.OTOK_CACHE_DIR }}/failed/
            if-no-files-found: ignore

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild annium.slnx /p:Configuration=Release /p:Platform=x64

      - name: Copy log configuration
        run: Copy-Item "projects\vs\tests\log.conf" "x64\Release\log.conf"

      # the DLLs of Otok/ are beside the executables (OtokCopyDlls of Otok/otok.targets)
      - name: Run tests
        run: |
          cd x64/Release
          $env:TESTS_HOME = "${{ github.workspace }}\tests"
          .\annium_tests.exe
